<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Torcedor | BorderKick</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="cabecalho">
        <a href="index.html" class="logo-texto">Border<span>Kick</span></a>
        <nav>
            <a href="login.html">Entrar</a>
            <a href="cadastro.html">Cadastrar</a>
        </nav>
    </header>

    <main class="container">
        <div class="card">
            <h2>Cadastro de Torcedor VIP</h2>

            <h3>Dados pessoais</h3>

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Seu nome completo">

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00">

            <label for="passaporte">Número do passaporte</label>
            <input type="text" id="passaporte" placeholder="Ex: AB123456">

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Crie uma senha">

            <h3>Documentos</h3>

            <label for="docPassaporte">Passaporte (foto ou PDF)</label>
            <input type="file" id="docPassaporte" accept="image/*,.pdf">

            <label for="docVisto">Visto Americano (foto ou PDF)</label>
            <input type="file" id="docVisto" accept="image/*,.pdf">

            <label for="docEsta">ESTA (foto ou PDF)</label>
            <input type="file" id="docEsta" accept="image/*,.pdf">

            <p>Após o envio, seu visto ficará como <span class="status status-pendente" id="statusVisto">Pendente</span> até a validação de um atendente.</p>

            <div class="aviso-erro" id="avisoCadastro">Preencha todos os campos e envie os documentos.</div>

            <button class="btn" id="btnCadastrar">Cadastrar</button>

            <p>Já tem conta? <a href="login.html">Entrar</a></p>
        </div>
    </main>

</body>
</html>
